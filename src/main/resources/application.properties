spring.application.name=CAMGAZ_TECH

server.port=8491

#mysql properties
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/CAMGAZ_TECH_db?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:1234}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# cors:
# allowed-origins: http://localhost:8424


# Configuration pour la sérialisation des dates avec Jackson
# Assure que les LocalDate sont sérialisées au format ISO (YYYY-MM-DD)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd


logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter.json=DEBUG